name: Build ECHO-1 APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Your Vercel address, e.g. https://echo-1-nu.vercel.app"
        required: true
        default: "https://echo-1-nu.vercel.app"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the project
        env:
          ECHO_URL: ${{ inputs.url }}
        run: |
          mkdir -p app/www app/native
          cd app
          cat > package.json <<'EOF'
          {
            "name": "echo-1-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "@capacitor/android": "^7.0.0", "@capacitor/core": "^7.0.0" },
            "devDependencies": { "@capacitor/cli": "^7.0.0" }
          }
          EOF
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.echo1.app',appName:'ECHO-1',webDir:'www',server:{url:process.env.ECHO_URL,androidScheme:'https'}},null,2))"
          cat > www/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO-1</title>
          <body style="margin:0;height:100vh;display:grid;place-items:center;background:#0c0a1c;color:#f4f1ff;font-family:sans-serif;text-align:center">
          <p>Can't reach the server. Check your internet and reopen the app.</p></body>
          EOF
          cat > native/AlarmPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.provider.AlarmClock;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Sets a real alarm or timer in the phone's Clock app. Websites are not allowed to do this, a native app is. */
          @CapacitorPlugin(name = "Alarm")
          public class AlarmPlugin extends Plugin {

              @PluginMethod
              public void set(PluginCall call) {
                  Integer hour = call.getInt("hour"), minute = call.getInt("minute");
                  if (hour == null || minute == null) { call.reject("hour and minute are required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, hour)
                      .putExtra(AlarmClock.EXTRA_MINUTES, minute)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Alarm"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              @PluginMethod
              public void timer(PluginCall call) {
                  Integer seconds = call.getInt("seconds");
                  if (seconds == null) { call.reject("seconds is required"); return; }
                  Intent i = new Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, seconds)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("label", "Timer"))
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  start(call, i);
              }

              private void start(PluginCall call, Intent i) {
                  try { getContext().startActivity(i); call.resolve(); }
                  catch (Exception e) { call.reject("No Clock app could handle this"); }
              }
          }
          EOF
          cat > native/LauncherPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Opens installed apps by package name, and store or other links. A website inside a WebView can't do this on its own. */
          @CapacitorPlugin(name = "Launcher")
          public class LauncherPlugin extends Plugin {

              private boolean view(String uri) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(uri)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      return true;
                  } catch (Exception e) { return false; }
              }

              /** Opens the app. If it is not installed, opens `fallback` if given, otherwise its Google Play page. */
              @PluginMethod
              public void launchPackage(PluginCall call) {
                  String pkg = call.getString("package");
                  String fallback = call.getString("fallback", "");
                  if (pkg == null || pkg.isEmpty()) { call.reject("package is required"); return; }
                  try {
                      Intent i = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
                      if (i != null) {
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);
                          call.resolve();
                          return;
                      }
                  } catch (Exception ignored) { }
                  if (fallback != null && !fallback.isEmpty() && view(fallback)) { call.resolve(); return; }
                  if (view("market://details?id=" + pkg) || view("https://play.google.com/store/apps/details?id=" + pkg)) { call.resolve(); return; }
                  call.reject("Could not open " + pkg);
              }

              /** Opens any link (market://, https://, a custom scheme). Falls back to `fallback` if nothing can open it. */
              @PluginMethod
              public void open(PluginCall call) {
                  String uri = call.getString("uri");
                  String fallback = call.getString("fallback", "");
                  if (uri == null || uri.isEmpty()) { call.reject("uri is required"); return; }
                  if (view(uri)) { call.resolve(); return; }
                  if (fallback != null && !fallback.isEmpty() && view(fallback)) { call.resolve(); return; }
                  call.reject("Nothing could open this link");
              }
          }
          EOF
          cat > native/AssistPlugin.java <<'EOF'
          package com.echo1.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Hands what you said or typed in the assistant bubble over to the ECHO-1 web app, and helps set ECHO-1 as the phone's assistant. */
          @CapacitorPlugin(name = "Assist")
          public class AssistPlugin extends Plugin {
              static volatile String pending = "";

              @PluginMethod
              public void takeQuery(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("text", pending == null ? "" : pending);
                  pending = "";
                  call.resolve(r);
              }

              @PluginMethod
              public void isDefault(PluginCall call) {
                  boolean yes = false;
                  try {
                      String s = Settings.Secure.getString(getContext().getContentResolver(), "assistant");
                      yes = s != null && s.contains(getContext().getPackageName());
                  } catch (Exception ignored) { }
                  JSObject r = new JSObject();
                  r.put("value", yes);
                  call.resolve(r);
              }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  String[] actions = { Settings.ACTION_VOICE_INPUT_SETTINGS, Settings.ACTION_MANAGE_DEFAULT_APPS_SETTINGS, Settings.ACTION_SETTINGS };
                  for (String a : actions) {
                      try {
                          getContext().startActivity(new Intent(a).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                          call.resolve();
                          return;
                      } catch (Exception ignored) { }
                  }
                  call.reject("Could not open settings");
              }

              @PluginMethod
              public void canOverlay(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("value", Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(getContext()));
                  call.resolve(r);
              }

              @PluginMethod
              public void requestOverlay(PluginCall call) {
                  try {
                      getContext().startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getContext().getPackageName()))
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                      call.resolve();
                  } catch (Exception e) { call.reject("Could not open the permission page"); }
              }

              @PluginMethod
              public void showBubble(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(getContext())) { call.reject("Overlay permission is off"); return; }
                  try {
                      android.content.SharedPreferences bp = getContext().getSharedPreferences("echo_bubble_prefs", android.content.Context.MODE_PRIVATE);
                      boolean auto = Boolean.TRUE.equals(call.getBoolean("auto", false));
                      if (auto && bp.getBoolean("removed", false)) { call.resolve(); return; }   // you dragged it away: stay removed until "show bubble"
                      if (!auto) bp.edit().putBoolean("removed", false).apply();
                      Intent i = new Intent(getContext(), BubbleService.class);
                      String base = call.getString("url");
                      if (base != null && base.startsWith("http")) i.putExtra("base", base);
                      i.putExtra("fromApp", true);
                      if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i); else getContext().startService(i);
                      call.resolve();
                  } catch (Exception e) { call.reject("Could not start the bubble"); }
              }

              @PluginMethod
              public void hideBubble(PluginCall call) {
                  try { getContext().stopService(new Intent(getContext(), BubbleService.class)); } catch (Exception ignored) { }
                  call.resolve();
              }
          }
          EOF
          cat > native/BubbleService.java <<'EOF'
          package com.echo1.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.Application;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.HapticFeedbackConstants;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONObject;

          /**
           * ECHO-1 floating companion: the same full-body chibi as inside the app.
           * It runs the app's own companion code (bubble.html) in a small transparent web view, so it blinks, waves, nods,
           * dozes off and reacts like the in-app chibi, and it uses the same saved look (boy or girl, colours, outfit).
           * Drag to move. Drag it down onto the X to remove it. Tap to talk. Long-press for size.
           */
          public class BubbleService extends Service {
              static final String PREFS = "echo_bubble_prefs";
              private static final String PX = "x", PY = "y", PH = "h", PBASE = "base", PREMOVED = "removed";
              static BubbleService live;

              private WindowManager wm;
              private FrameLayout box;
              private WebView web;
              private ImageView fallback;
              private WindowManager.LayoutParams lp;
              private FrameLayout zone;
              private GradientDrawable zoneBg;
              private boolean zoneShown = false, overZone = false, failed = false, wasHidden = false;
              private SharedPreferences prefs;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private int appScreens = 0;
              private Application.ActivityLifecycleCallbacks life;

              // touch state
              private float downX, downY;
              private int startX, startY;
              private boolean moved, longDone;
              private final Runnable longPress = new Runnable() {
                  @Override public void run() { if (!moved) { longDone = true; showCustomize(); } }
              };

              // ---- called by the assistant card, so the chibi reacts while you talk to it ----
              static void js(final String code) {
                  final BubbleService s = live;
                  if (s == null) return;
                  s.ui.post(new Runnable() {
                      @Override public void run() { try { if (s.web != null && !s.failed) s.web.evaluateJavascript(code, null); } catch (Exception ignored) { } }
                  });
              }
              static void state(String st) { js("window.EchoBubble&&EchoBubble.state('" + st + "')"); }
              static void gesture(String g) { js("window.EchoBubble&&EchoBubble.gesture('" + g + "')"); }
              static void react(String text, boolean fromUser) { js("window.EchoBubble&&EchoBubble.react(" + JSONObject.quote(text == null ? "" : text) + "," + fromUser + ")"); }

              @Override public IBinder onBind(Intent i) { return null; }
              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              @Override public void onCreate() {
                  super.onCreate();
                  live = this;
                  // The chibi inside the app is the same character, so the floating one hides while ECHO-1 itself is open.
                  life = new Application.ActivityLifecycleCallbacks() {
                      @Override public void onActivityStarted(Activity a) { if (a instanceof MainActivity) { appScreens++; syncVisible(); } }
                      @Override public void onActivityStopped(Activity a) { if (a instanceof MainActivity) { appScreens = Math.max(0, appScreens - 1); syncVisible(); } }
                      @Override public void onActivityCreated(Activity a, Bundle b) { }
                      @Override public void onActivityResumed(Activity a) { }
                      @Override public void onActivityPaused(Activity a) { }
                      @Override public void onActivitySaveInstanceState(Activity a, Bundle b) { }
                      @Override public void onActivityDestroyed(Activity a) { }
                  };
                  try { getApplication().registerActivityLifecycleCallbacks(life); } catch (Exception ignored) { }
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                  if (intent != null && "STOP".equals(intent.getAction())) {
                      prefs.edit().putBoolean(PREMOVED, true).apply();
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (intent != null && intent.getStringExtra("base") != null) prefs.edit().putString(PBASE, intent.getStringExtra("base")).apply();
                  goForeground();
                  if (box == null) {
                      // Started from inside the app: the app is in front, so stay hidden until it is closed (its own chibi is on screen).
                      if (intent != null && intent.getBooleanExtra("fromApp", false)) appScreens = 1;
                      addBubble();
                  }
                  return START_STICKY;
              }

              private void goForeground() {
                  String ch = "echo_bubble";
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(ch) == null)
                      nm.createNotificationChannel(new NotificationChannel(ch, "ECHO-1 bubble", NotificationManager.IMPORTANCE_MIN));
                  PendingIntent hide = PendingIntent.getService(this, 1, new Intent(this, BubbleService.class).setAction("STOP"),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder nb = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ch) : new Notification.Builder(this);
                  nb.setContentTitle("ECHO-1 companion is on").setContentText("Tap here to hide it · or drag it down to remove it")
                    .setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentIntent(hide).setOngoing(true);
                  Notification n = nb.build();
                  if (Build.VERSION.SDK_INT >= 34) startForeground(7, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(7, n);
              }

              private DisplayMetrics real() {
                  DisplayMetrics m = new DisplayMetrics();
                  wm.getDefaultDisplay().getRealMetrics(m);
                  return m;
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void addBubble() {
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  int h = dp(prefs.getInt(PH, 120));
                  int w = Math.round(h * 22f / 32f);

                  box = new FrameLayout(this) {
                      @Override public boolean onInterceptTouchEvent(MotionEvent e) { return true; }
                      @Override public boolean onTouchEvent(MotionEvent e) { return handleTouch(e); }
                  };

                  // Simple icon, only shown if the chibi page can't load (for example, no internet).
                  fallback = new ImageView(this);
                  fallback.setImageResource(R.drawable.echo_widget_icon);
                  fallback.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  fallback.setPadding(dp(6), dp(6), dp(6), dp(6));
                  GradientDrawable fb = new GradientDrawable();
                  fb.setShape(GradientDrawable.OVAL);
                  fb.setColor(0xFF14101F);
                  fb.setStroke(dp(2), 0xFFC8F43A);
                  fallback.setBackground(fb);
                  fallback.setVisibility(View.GONE);
                  box.addView(fallback, new FrameLayout.LayoutParams(Math.min(w, h), Math.min(w, h), Gravity.CENTER));

                  web = new WebView(getApplicationContext());
                  web.setBackgroundColor(Color.TRANSPARENT);
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);
                  WebSettings ws = web.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);          // same site storage as the app, so it uses your saved look
                  web.setWebViewClient(new WebViewClient() {
                      @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError err) { if (r.isForMainFrame()) showFallback(); }
                      @Override public void onReceivedHttpError(WebView v, WebResourceRequest r, WebResourceResponse res) { if (r.isForMainFrame() && res.getStatusCode() >= 400) showFallback(); }
                      @Override public void onPageFinished(WebView v, String u) { if (!failed) gesture("wave"); }
                  });
                  box.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  lp = new WindowManager.LayoutParams(w, h,
                      Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.x = prefs.getInt(PX, dp(12));
                  lp.y = prefs.getInt(PY, dp(240));
                  try { wm.addView(box, lp); } catch (Exception e) { box = null; stopSelf(); return; }

                  String base = prefs.getString(PBASE, "");
                  if (base == null || base.length() < 8) showFallback();
                  else web.loadUrl(base.replaceAll("/+$", "") + "/bubble.html?from=android");
                  syncVisible();
              }

              private void showFallback() {
                  failed = true;
                  ui.post(new Runnable() {
                      @Override public void run() {
                          if (web != null) web.setVisibility(View.GONE);
                          if (fallback != null) fallback.setVisibility(View.VISIBLE);
                      }
                  });
              }

              private void syncVisible() {
                  if (box == null) return;
                  boolean hide = appScreens > 0;
                  if (hide) { wasHidden = true; box.setVisibility(View.GONE); try { if (web != null) web.onPause(); } catch (Exception ignored) { } return; }
                  box.setVisibility(View.VISIBLE);
                  try { if (web != null) web.onResume(); } catch (Exception ignored) { }
                  if (wasHidden) {            // you may have changed her look in the app, so load it again
                      wasHidden = false;
                      if (web != null && !failed) { try { web.reload(); } catch (Exception ignored) { } }
                  }
              }

              // ---- touch: drag to move, drag down onto the X to remove, tap to talk, long-press for size ----
              private boolean handleTouch(MotionEvent e) {
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          downX = e.getRawX(); downY = e.getRawY(); startX = lp.x; startY = lp.y; moved = false; longDone = false;
                          ui.postDelayed(longPress, 550);
                          return true;
                      case MotionEvent.ACTION_MOVE: {
                          if (!moved && (Math.abs(e.getRawX() - downX) > dp(8) || Math.abs(e.getRawY() - downY) > dp(8))) {
                              moved = true;
                              ui.removeCallbacks(longPress);
                              showZone();
                              js("window.EchoBubble&&EchoBubble.drag(true)");
                          }
                          if (moved) {
                              DisplayMetrics m = real();
                              lp.x = Math.max(0, Math.min(m.widthPixels - lp.width, startX + Math.round(e.getRawX() - downX)));
                              lp.y = Math.max(0, Math.min(m.heightPixels - lp.height, startY + Math.round(e.getRawY() - downY)));
                              try { wm.updateViewLayout(box, lp); } catch (Exception ignored) { }
                              checkZone(m);
                          }
                          return true;
                      }
                      case MotionEvent.ACTION_UP:
                      case MotionEvent.ACTION_CANCEL: {
                          ui.removeCallbacks(longPress);
                          boolean up = e.getActionMasked() == MotionEvent.ACTION_UP;
                          if (moved) {
                              boolean drop = overZone;
                              hideZone();
                              js("window.EchoBubble&&EchoBubble.drag(false)");
                              if (drop && up) { removeForGood(); return true; }
                              prefs.edit().putInt(PX, lp.x).putInt(PY, lp.y).apply();
                          } else if (up && !longDone) {
                              gesture("wave");
                              openAssistant();
                          }
                          return true;
                      }
                  }
                  return true;
              }

              private void showZone() {
                  if (zoneShown) return;
                  zone = new FrameLayout(this);
                  zoneBg = new GradientDrawable();
                  zoneBg.setShape(GradientDrawable.OVAL);
                  zoneBg.setColor(0xCC14101F);
                  zoneBg.setStroke(dp(2), 0x66FFFFFF);
                  zone.setBackground(zoneBg);
                  TextView x = new TextView(this);
                  x.setText("✕");
                  x.setTextColor(0xFFF4F1FF);
                  x.setTextSize(22);
                  x.setGravity(Gravity.CENTER);
                  zone.addView(x, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WindowManager.LayoutParams zl = new WindowManager.LayoutParams(dp(68), dp(68),
                      Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT);
                  zl.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                  zl.y = dp(56);
                  try { wm.addView(zone, zl); zoneShown = true; } catch (Exception ignored) { zone = null; }
                  overZone = false;
              }

              private void checkZone(DisplayMetrics m) {
                  if (!zoneShown || zone == null) return;
                  float cx = lp.x + lp.width / 2f, cy = lp.y + lp.height / 2f;
                  float zx = m.widthPixels / 2f, zy = m.heightPixels - dp(56) - dp(34);
                  boolean over = Math.hypot(cx - zx, cy - zy) < dp(95);
                  if (over != overZone) {
                      overZone = over;
                      zoneBg.setColor(over ? 0xFFE5484D : 0xCC14101F);
                      zone.setScaleX(over ? 1.3f : 1f);
                      zone.setScaleY(over ? 1.3f : 1f);
                      if (over) { try { box.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS); } catch (Exception ignored) { } }
                  }
              }

              private void hideZone() {
                  if (zone != null) { try { wm.removeView(zone); } catch (Exception ignored) { } }
                  zone = null; zoneShown = false; overZone = false;
              }

              private void removeForGood() {
                  prefs.edit().putBoolean(PREMOVED, true).apply();   // stays removed until you say "show bubble" again
                  stopSelf();
              }

              private void openAssistant() {
                  try { startActivity(new Intent(BubbleService.this, AssistActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP)); }
                  catch (Exception ignored) { Toast.makeText(this, "Could not open ECHO-1", Toast.LENGTH_SHORT).show(); }
              }

              private void showCustomize() {
                  if (box == null || !box.isAttachedToWindow()) return;
                  final String[] choices = new String[] { "Small", "Medium", "Large", "Extra large", "Remove from screen" };
                  AlertDialog dialog = new AlertDialog.Builder(this).setTitle("ECHO-1 companion")
                      .setItems(choices, new android.content.DialogInterface.OnClickListener() {
                          @Override public void onClick(android.content.DialogInterface d, int which) {
                              if (which < 4) {
                                  int[] hs = new int[] { 90, 120, 150, 180 };
                                  int h = dp(hs[which]);
                                  prefs.edit().putInt(PH, hs[which]).apply();
                                  lp.height = h;
                                  lp.width = Math.round(h * 22f / 32f);
                                  try { wm.updateViewLayout(box, lp); } catch (Exception ignored) { }
                              } else removeForGood();
                          }
                      }).setNegativeButton("Cancel", null).create();
                  if (dialog.getWindow() != null && Build.VERSION.SDK_INT >= 26) dialog.getWindow().setType(WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY);
                  dialog.show();
              }

              @Override public void onDestroy() {
                  super.onDestroy();
