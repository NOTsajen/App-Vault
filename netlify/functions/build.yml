                  <service android:name=".EchoRecognitionService" android:exported="true">
                      <intent-filter><action android:name="android.speech.RecognitionService" /><category android:name="android.intent.category.DEFAULT" /></intent-filter>
                      <meta-data android:name="android.speech" android:resource="@xml/echo_recognizer" />
                  </service>
                  <activity android:name=".AssistActivity" android:theme="@style/EchoBubble" android:exported="true" android:excludeFromRecents="true"
                      android:launchMode="singleTask" android:taskAffinity="" android:windowSoftInputMode="adjustResize" />
                  <receiver android:name=".EchoWidget" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/echo_widget_info" />
                  </receiver>
                  <service android:name=".BubbleService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Floating assistant shortcut" />
                  </service>
              </application>`);
          }
          // The wide "Ask Echo" bar widget (added separately so it also lands on projects patched before it existed).
          if (!x.includes(".EchoBarWidget")) {
            x = x.replace("</application>", `
                  <receiver android:name=".EchoBarWidget" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/echo_bar_widget_info" />
                  </receiver>
              </application>`);
          }
          // Screen sharing (only after you allow it): lets the bubble panel see the screen.
          if (!x.includes(".ScreenService")) {
            x = x.replace("</application>", `
                  <service android:name=".ScreenService" android:exported="false" android:foregroundServiceType="mediaProjection" />
              </application>`);
          }
          fs.writeFileSync(mf, x);
          console.log("Android project patched: alarm, launcher, assistant bubble + permissions.");
          EOF
          cat > native/make-icons.py <<'EOF'
          # Builds the Android launcher icons from the ECHO-1 icons on your website. Usage: python3 make-icons.py https://your-site
          import io, os, sys, urllib.request
          from PIL import Image, ImageDraw

          base = sys.argv[1].rstrip("/")
          res = os.path.join("android", "app", "src", "main", "res")

          def get(name):
              with urllib.request.urlopen(base + "/" + name, timeout=30) as r:
                  return Image.open(io.BytesIO(r.read())).convert("RGBA")

          icon, mask = get("icon-512.png"), get("icon-maskable-512.png")
          bg = icon.getpixel((2, 2))[:3]
          hexbg = "#%02X%02X%02X" % bg

          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, px in legacy.items():
              out = os.path.join(res, "mipmap-" + d)
              os.makedirs(out, exist_ok=True)
              sq = icon.resize((px, px), Image.LANCZOS)
              sq.save(os.path.join(out, "ic_launcher.png"))
              m = Image.new("L", (px * 4, px * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, px * 4 - 1, px * 4 - 1), fill=255)
              rd = sq.copy(); rd.putalpha(m.resize((px, px), Image.LANCZOS))
              rd.save(os.path.join(out, "ic_launcher_round.png"))
              fg = mask.resize((px * 9 // 4, px * 9 // 4), Image.LANCZOS)      # adaptive icon layer is 108dp = 2.25 x the 48dp icon
              fg.save(os.path.join(out, "ic_launcher_foreground.png"))

          os.makedirs(os.path.join(res, "values"), exist_ok=True)
          open(os.path.join(res, "values", "ic_launcher_background.xml"), "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + hexbg + '</color>\n</resources>\n')
          os.makedirs(os.path.join(res, "mipmap-anydpi-v26"), exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n')
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(os.path.join(res, "mipmap-anydpi-v26", n), "w").write(xml)
          # Round icon for the home screen widget
          wd = os.path.join(res, "drawable-nodpi"); os.makedirs(wd, exist_ok=True)
          m0 = int(icon.size[0] * 0.0625)
          wi = icon.crop((m0, m0, icon.size[0] - m0, icon.size[0] - m0)).resize((256, 256), Image.LANCZOS)
          wm = Image.new("L", (1024, 1024), 0); ImageDraw.Draw(wm).ellipse((0, 0, 1023, 1023), fill=255)
          wi.putalpha(wm.resize((256, 256), Image.LANCZOS)); wi.save(os.path.join(wd, "echo_widget_icon.png"))
          print("ECHO-1 icons written, background", hexbg)
          EOF
      - name: Use the same signing key (so a new build installs over the old app)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "Using saved signing key"; else echo "No saved key. Uninstall the old app before installing this one."; fi
      - name: Build the Android app
        working-directory: app
        env:
          ECHO_URL: ${{ inputs.url }}
        run: |
          npm install
          npx cap add android
          node native/patch-android.js
          pip install --quiet pillow
          python3 native/make-icons.py "$ECHO_URL" || echo "Icon step skipped, using the default icon"
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ECHO-1-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk ECHO-1.apk
          gh release create "v${{ github.run_number }}" ECHO-1.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ECHO-1 v${{ github.run_number }}" --notes "Install ECHO-1.apk on your Android phone." --latest
          echo "Download link: https://github.com/${{ github.repository }}/releases/latest/download/ECHO-1.apk"
