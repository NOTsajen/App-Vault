                              try {
                                  startActivity(new Intent(AlarmClock.ACTION_SET_TIMER).putExtra(AlarmClock.EXTRA_LENGTH, seconds)
                                      .putExtra(AlarmClock.EXTRA_MESSAGE, label == null ? "Timer" : label).putExtra(AlarmClock.EXTRA_SKIP_UI, false).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
