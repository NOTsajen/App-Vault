          package com.echo1.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import java.io.ByteArrayOutputStream;
          import java.nio.ByteBuffer;

          /** Lets ECHO-1 see your screen, only after you allow it. Holds the screen-capture permission and hands out one small JPEG when asked. */
          public class ScreenService extends Service {
              static volatile boolean active = false;
              private static volatile ScreenService inst;
              private MediaProjection mp;
              private VirtualDisplay vd;
              private ImageReader ir;
              private HandlerThread ht;
              private int w, h;
              private volatile Bitmap last;
              private volatile boolean want = false;
              private volatile long lastConv = 0;
              private final Object lock = new Object();

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent in, int flags, int id) {
                  if (in != null && "stop".equals(in.getAction())) { shutdown(); return START_NOT_STICKY; }
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      String ch = "echo_screen";
                      if (android.os.Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel(ch) == null)
                          nm.createNotificationChannel(new NotificationChannel(ch, "ECHO-1 screen sharing", NotificationManager.IMPORTANCE_LOW));
                      PendingIntent stop = PendingIntent.getService(this, 3, new Intent(this, ScreenService.class).setAction("stop"), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      Notification.Builder nb = android.os.Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ch) : new Notification.Builder(this);
                      nb.setSmallIcon(android.R.drawable.ic_menu_view).setContentTitle("ECHO-1 can see your screen").setContentText("Tap to stop sharing").setContentIntent(stop).setOngoing(true);
                      Notification n = nb.build();
                      if (android.os.Build.VERSION.SDK_INT >= 29) startForeground(9, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                      else startForeground(9, n);
                      int code = in == null ? 0 : in.getIntExtra("code", 0);
                      Intent data = in == null ? null : (Intent) in.getParcelableExtra("data");
                      if (data == null) { shutdown(); return START_NOT_STICKY; }
                      MediaProjectionManager m = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      mp = m.getMediaProjection(code, data);
                      ht = new HandlerThread("echo-screen"); ht.start();
                      Handler bg = new Handler(ht.getLooper());
                      mp.registerCallback(new MediaProjection.Callback() { @Override public void onStop() { shutdown(); } }, bg);
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      float sc = Math.min(1f, 960f / Math.max(dm.widthPixels, dm.heightPixels));
                      w = Math.max(2, Math.round(dm.widthPixels * sc)); h = Math.max(2, Math.round(dm.heightPixels * sc));
                      ir = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2);
                      ir.setOnImageAvailableListener(new ImageReader.OnImageAvailableListener() {
                          @Override public void onImageAvailable(ImageReader r) {
                              Image im = null;
                              try {
                                  im = r.acquireLatestImage();
                                  if (im == null) return;
                                  long now = System.currentTimeMillis();
                                  if (!want && now - lastConv < 1500) return;   // while nobody asks, keep the work tiny
                                  Image.Plane p = im.getPlanes()[0];
                                  ByteBuffer buf = p.getBuffer();
                                  int ps = p.getPixelStride(), rs = p.getRowStride();
                                  Bitmap full = Bitmap.createBitmap(rs / ps, h, Bitmap.Config.ARGB_8888);
                                  full.copyPixelsFromBuffer(buf);
                                  Bitmap b = full.getWidth() == w ? full : Bitmap.createBitmap(full, 0, 0, w, h);
                                  last = b; lastConv = now;
                                  if (want) { want = false; synchronized (lock) { lock.notifyAll(); } }
                              } catch (Exception ignored) {
                              } finally { if (im != null) im.close(); }
                          }
                      }, bg);
                      vd = mp.createVirtualDisplay("echo-screen", w, h, dm.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir.getSurface(), null, bg);
                      inst = this; active = true;
                  } catch (Exception e) { shutdown(); }
                  return START_NOT_STICKY;
              }

              /** One JPEG of the screen as base64, or null. Waits briefly for a fresh frame. */
              static String grab() {
                  ScreenService s = inst;
                  if (s == null || !active) return null;
                  try {
                      synchronized (s.lock) { s.want = true; s.lock.wait(1400); }
                      s.want = false;
                      Bitmap b = s.last;
                      if (b == null) return null;
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      b.compress(Bitmap.CompressFormat.JPEG, 70, o);
                      return Base64.encodeToString(o.toByteArray(), Base64.NO_WRAP);
                  } catch (Exception e) { return null; }
              }

              private void shutdown() {
                  active = false; inst = null;
                  try { if (vd != null) vd.release(); } catch (Exception ignored) { }
                  try { if (ir != null) ir.close(); } catch (Exception ignored) { }
                  try { if (mp != null) mp.stop(); } catch (Exception ignored) { }
                  try { if (ht != null) ht.quitSafely(); } catch (Exception ignored) { }
                  vd = null; ir = null; mp = null; ht = null; last = null;
                  try { stopForeground(true); } catch (Exception ignored) { }
                  stopSelf();
              }

              @Override public void onDestroy() { active = false; inst = null; super.onDestroy(); }
          }
