              // ---------------- spoken replies ----------------

              private void speakNative(String text, String l, float rate) {
                  if (text == null || text.trim().length() == 0 || isFinishing()) return;
                  stopListening();
                  pendingSpeech = text.length() > 600 ? text.substring(0, 600) : text;
                  pendingLang = (l == null || l.length() < 2) ? "en-US" : l;
                  pendingRate = (rate < 0.5f || rate > 2f) ? 1f : rate;
                  if (tts == null) {
                      tts = new TextToSpeech(getApplicationContext(), new TextToSpeech.OnInitListener() {
                          @Override public void onInit(int status) {
                              ttsReady = (status == TextToSpeech.SUCCESS);
                              if (ttsReady) {
                                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                      @Override public void onStart(String id) { event("speakStart", null); }
                                      @Override public void onDone(String id) { event("speakEnd", null); }
                                      @Override public void onError(String id) { event("speakEnd", null); }
                                  });
                                  h.post(new Runnable() { @Override public void run() { playPending(); } });
                              } else { event("speakEnd", null); }
                          }
                      });
                      return;
                  }
                  if (ttsReady) playPending();
              }

              private void playPending() {
                  if (tts == null || !ttsReady || pendingSpeech == null) return;
                  try {
                      String[] p = pendingLang.split("-");
                      Locale loc = p.length > 1 ? new Locale(p[0], p[1]) : new Locale(p[0]);
                      int r = tts.isLanguageAvailable(loc);
                      if (r >= TextToSpeech.LANG_AVAILABLE) tts.setLanguage(loc);
                      tts.setSpeechRate(pendingRate);
                      tts.speak(pendingSpeech, TextToSpeech.QUEUE_FLUSH, null, "echo-reply");
                  } catch (Exception e) { event("speakEnd", null); }
                  pendingSpeech = null;
              }

              private void stopSpeaking() {
                  pendingSpeech = null;
                  try { if (tts != null) tts.stop(); } catch (Exception ignored) { }
              }

              // ---------------- voice ----------------

              private void startListening() {
                  if (isFinishing() || listening) return;
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[] { Manifest.permission.RECORD_AUDIO }, REQ_MIC);
                      return;
                  }
                  if (attempt >= 2 || !SpeechRecognizer.isRecognitionAvailable(this)) { openVoiceWindow(); return; }
                  try {
                      makeRecognizer(attempt == 1);
                      Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang)
                          .putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          .putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
                      listening = true;
                      BubbleService.state("listening");
                      event("listening", null);
                      ready = false;
                      h.removeCallbacks(watch); h.postDelayed(watch, 3500);
                      rec.startListening(i);
                  } catch (Exception e) {
                      listening = false;
                      nextEngine();
                  }
              }

              private void destroyRecognizer() {
                  if (rec != null) {
                      try { rec.cancel(); } catch (Exception ignored) { }
                      try { rec.destroy(); } catch (Exception ignored) { }
                      rec = null;
                  }
              }

              private void makeRecognizer(boolean useDefault) {
                  destroyRecognizer();   // a fresh one every time avoids "too many requests" (code 10)
                  if (!useDefault) {
                      try {
                          // If ECHO-1 is the assistant, Android's default speech engine can point back at ECHO-1. Ask Google's directly.
                          rec = SpeechRecognizer.createSpeechRecognizer(this,
                              new ComponentName("com.google.android.googlequicksearchbox", "com.google.android.voicesearch.serviceapi.GoogleRecognitionService"));
                      } catch (Exception ignored) { rec = null; }
                  }
                  if (rec == null) rec = SpeechRecognizer.createSpeechRecognizer(this);
                  rec.setRecognitionListener(this);
              }

              private void nextEngine() {
                  h.removeCallbacks(watch);
                  attempt++;
                  destroyRecognizer();
                  if (attempt >= 2) { openVoiceWindow(); return; }
                  h.postDelayed(new Runnable() { @Override public void run() { startListening(); } }, 700);
              }

              /** Last resort that works on almost every phone: the phone's own voice window. */
              private void openVoiceWindow() {
                  try {
                      Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang)
                          .putExtra(RecognizerIntent.EXTRA_PROMPT, "Say it to ECHO-1");
                      startActivityForResult(i, REQ_DIALOG);
                  } catch (Exception e) {
                      event("err", "Voice isn't available on this phone. Type instead.");
                  }
              }

              private void stopListening() {
                  h.removeCallbacks(watch);
                  boolean was = listening;
                  listening = false;
                  try { if (rec != null) rec.stopListening(); } catch (Exception ignored) { }
                  if (was) { BubbleService.state("idle"); event("stopped", null); }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED) startListening();
                  else event("err", "Mic permission is off. Type instead, or allow it in Settings.");
              }

              @Override
              protected void onActivityResult(int code, int result, Intent data) {
                  super.onActivityResult(code, result, data);
                      if (code == REQ_SCREEN) {
                          if (result == RESULT_OK && data != null) {
                              try {
                                  Intent si = new Intent(this, ScreenService.class).putExtra("code", result).putExtra("data", data);
                                  if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(si); else startService(si);
                                  final int[] tries = { 0 };
                                  h.postDelayed(new Runnable() { @Override public void run() {
                                      if (ScreenService.active) event("screenOn", null);
                                      else if (++tries[0] < 12) h.postDelayed(this, 250);
                                      else event("screenErr", "Screen sharing didn't start. Try again.");
                                  } }, 250);
                              } catch (Exception e) { event("screenErr", "Screen sharing didn't start. Try again."); }
                          } else event("screenErr", "Screen sharing was not allowed.");
                          return;
                      }
                      if (code != REQ_DIALOG) return;
                  if (code != REQ_DIALOG) return;
                  ArrayList<String> list = (result == RESULT_OK && data != null) ? data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS) : null;
                  if (list != null && !list.isEmpty()) event("final", list.get(0));
                  else event("err", "Didn't catch that. Tap the mic to try again.");
              }

              @Override
              public void onResults(Bundle results) {
                  h.removeCallbacks(watch);
                  listening = false;
                  BubbleService.state("idle");
                  ArrayList<String> list = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if (list != null && !list.isEmpty()) event("final", list.get(0));
                  else event("err", "Didn't catch that. Tap the mic to try again.");
              }

              @Override
              public void onPartialResults(Bundle partial) {
                  ArrayList<String> list = partial.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if (list != null && !list.isEmpty()) event("partial", list.get(0));
              }

              @Override
              public void onError(int error) {
                  h.removeCallbacks(watch);
                  listening = false;
                  BubbleService.state("idle");
                  if (error == SpeechRecognizer.ERROR_NO_MATCH || error == SpeechRecognizer.ERROR_SPEECH_TIMEOUT) { event("stopped", null); return; }
                  if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) { event("err", "Mic permission is off. Type instead."); return; }
                  if (error == SpeechRecognizer.ERROR_NETWORK || error == SpeechRecognizer.ERROR_NETWORK_TIMEOUT) { event("err", "No internet for voice. Type instead."); return; }
                  if (error == SpeechRecognizer.ERROR_AUDIO) { event("err", "The microphone is busy. Close other apps using it and try again."); return; }
                  nextEngine();   // engine problems (codes 4, 5, 8, 10, 11, 12, 13 ...): switch engine instead of giving up
              }

              @Override public void onReadyForSpeech(Bundle p) { ready = true; h.removeCallbacks(watch); }
              @Override public void onBeginningOfSpeech() { ready = true; h.removeCallbacks(watch); }
              @Override public void onRmsChanged(float rms) { }
              @Override public void onBufferReceived(byte[] buf) { }
              @Override public void onEndOfSpeech() { }
              @Override public void onEvent(int type, Bundle p) { }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  // opened again while already showing (second hold of Home, widget tap): start over
                  if (failed || web == null) { loadPanel(intent); return; }
                  stopSpeaking();
                  if ("voice".equals(cleanMode(intent != null ? intent.getStringExtra("mode") : null)) && jsReady) { attempt = 0; startListening(); }
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  // leaving the panel (another app opened) must never leave the microphone or the voice running
                  stopListening();
                  stopSpeaking();
              }

              @Override
              public void onBackPressed() {
                  finish();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  h.removeCallbacksAndMessages(null);
                  destroyRecognizer();
                  try { if (tts != null) { tts.stop(); tts.shutdown(); } } catch (Exception ignored) { }
                  tts = null;
                  if (web != null) { try { ((ViewGroup) web.getParent()).removeView(web); } catch (Exception ignored) { } web.destroy(); web = null; }
                  BubbleService.state("idle");
              }
          }
